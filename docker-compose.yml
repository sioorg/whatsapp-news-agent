services:
  agent:
    build: .
    image: whatsapp-news-agent:latest
    container_name: whatsapp-news-agent
    restart: unless-stopped

    # Secrets stay out of the image and out of git.
    env_file: .env

    # Overrides .env: the store must live on the mounted volume, not in the
    # container's ephemeral filesystem.
    environment:
      CHECKPOINT_DB: /data/checkpoints.sqlite

    # Loopback only. cloudflared reaches the app over the shared Docker
    # network, not through this binding — it exists so you can curl
    # localhost:8000/health on the host while debugging.
    ports:
      - "127.0.0.1:8000:8000"

    networks:
      - edge

    # Survives container replacement; holds the conversation store.
    volumes:
      - agent-data:/data

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agent-data:

networks:
  # Shared with the cloudflared container so it can reach this service by
  # name. The default bridge network has no DNS, so this is required, not
  # optional. On the host, once:
  #
  #   docker network create edge
  #   docker network connect edge cloudflared-tunnel
  #
  # Attaching rather than replacing keeps cloudflared on the default bridge,
  # where its existing 172.17.0.1 routes to host-published ports still work.
  edge:
    external: true
    name: edge
