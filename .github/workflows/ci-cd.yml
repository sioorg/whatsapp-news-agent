name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # The lock file is what the image installs, so CI tests the same
        # versions that will run in production.
        run: |
          pip install -r requirements.lock.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        # conftest.py supplies dummy credentials; nothing here touches a real
        # API, so no secrets are needed.
        run: pytest -q

  deploy:
    name: Deploy to Ubuntu
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    # Self-hosted runner on the home server. It polls GitHub outbound, so the
    # box needs no inbound ports and no SSH exposure.
    runs-on: [self-hosted, Linux]

    # Never let two deploys interleave on the same machine.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/mysio/whatsapp-news-agent' }}

    steps:
      - name: Pull latest code
        run: |
          cd "$DEPLOY_DIR"
          git fetch --prune origin main
          # --ff-only: refuse to deploy if the checkout has diverged, rather
          # than silently merging over local edits.
          git reset --hard origin/main
          echo "deploying $(git rev-parse --short HEAD)"

      - name: Rebuild and restart
        run: |
          cd "$DEPLOY_DIR"
          docker compose up -d --build

      - name: Wait for healthy
        run: |
          cd "$DEPLOY_DIR"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "healthy after ${i}s"
              curl -s http://127.0.0.1:8000/health
              exit 0
            fi
            sleep 1
          done
          echo "::error::service did not become healthy within 30s"
          docker compose logs --tail 50
          exit 1

      - name: Clean up old images
        if: success()
        run: docker image prune -f
